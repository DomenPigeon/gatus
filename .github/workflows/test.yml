name: test
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '.examples/**'
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.examples/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
      - uses: actions/checkout@v5
      - name: Build binary to make sure it works
        run: go build
      - name: Test
        # We're using "sudo" because one of the tests leverages ping, which requires super-user privileges.
        # As for the 'env "PATH=$PATH" "GOROOT=$GOROOT"', we need it to use the same "go" executable that
        # was configured by the "Set up Go" step (otherwise, it'd use sudo's "go" executable)
        # TestCheckSSHBanner/no-auth-ssh opens a real SSH connection to tty.sdf.org, so it fails
        # whenever that third party host is slow or unreachable from the runner.
        run: sudo env "PATH=$PATH" "GOROOT=$GOROOT" go test ./... -race -coverprofile=coverage.txt -covermode=atomic -skip 'TestCheckSSHBanner/no-auth-ssh'
      - name: Codecov
        uses: codecov/codecov-action@v6.0.1
        with:
          files: ./coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
